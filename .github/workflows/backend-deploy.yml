name: Deploy Recipe Generator Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'Recipe_Generator/backend/**'
      - '.github/workflows/recipe-backend-deploy.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ${{ secrets.EC2_APP_DIR }}
            git pull origin main
            npm install
            pm2 restart recipe-backend || pm2 start server.js --name recipe-backend
            pm2 save
          EOF